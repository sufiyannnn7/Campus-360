kind = "web"
previewPath = "/"
title = "CampusHub"
description = "CampusHub is a smart campus event and club management platform for students, faculty, club coordinators, and administrators. It centralizes event discovery, registration, QR attendance, club management, recruitment, news, certificates, gamification, analytics, and an AI assistant into one cohesive web app."
version = "1.0.0"
id = "artifacts/campushub"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20013

[services.development]
run = "pnpm --filter @workspace/campushub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/campushub", "run", "build" ]
serve = "static"
publicDir = "artifacts/campushub/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20013"
BASE_PATH = "/"
